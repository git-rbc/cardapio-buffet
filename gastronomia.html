<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gastronomia Indaiá</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141019'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='18' fill='%23C08A57' text-anchor='middle'%3E%26amp;%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:'Cormorant Garamond';font-weight:400;font-display:swap;src:url('assets/fonts/cormorant-garamond-400.woff2') format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-weight:600;font-display:swap;src:url('assets/fonts/cormorant-garamond-600.woff2') format('woff2');}
@font-face{font-family:'Cormorant Garamond';font-weight:700;font-display:swap;src:url('assets/fonts/cormorant-garamond-700.woff2') format('woff2');}
@font-face{font-family:'Montserrat';font-weight:400;font-display:swap;src:url('assets/fonts/montserrat-400.woff2') format('woff2');}
@font-face{font-family:'Montserrat';font-weight:500;font-display:swap;src:url('assets/fonts/montserrat-500.woff2') format('woff2');}

:root{
  --night:#141019;--night-2:#0C0910;--cream:#F0E8DC;--accent:#C08A57;
  --line-light:rgba(240,232,220,.18);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat','Segoe UI',system-ui,sans-serif;
  --pad:clamp(1rem,3vw,2.4rem);--ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:18px;background:var(--night);height:100%;}
body{background:var(--night);color:var(--cream);font-family:var(--sans);font-weight:400;
  height:100%;display:flex;flex-direction:column;overflow:hidden;}
img{display:block;max-width:100%;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

/* ===== BARRA DO HUB =====
   e a unica coisa que fica fixa: logo, as duas frentes e o material aberto.
   tudo o mais e conteudo do material, que roda no quadro abaixo. */
.barra{flex:0 0 auto;background:var(--night-2);border-bottom:1px solid var(--line-light);}
.barra__linha{display:flex;align-items:center;gap:clamp(1rem,3vw,2.4rem);padding:.75rem var(--pad);}
.barra__logo{height:24px;width:auto;opacity:.95;flex:0 0 auto;}

.frentes{display:flex;gap:.4rem;}
.frente{background:none;border:1px solid transparent;color:rgba(240,232,220,.72);cursor:pointer;
  font-family:var(--serif);font-weight:600;font-size:1.24rem;line-height:1;letter-spacing:.01em;
  padding:.5rem .95rem;transition:color .3s,border-color .3s,background .3s;}
.frente:hover{color:var(--cream);}
.frente[aria-selected="true"]{color:var(--night);background:var(--cream);border-color:var(--cream);}

.barra__fim{margin-left:auto;font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(240,232,220,.5);flex:0 0 auto;}

.pecas{display:flex;gap:.35rem;flex-wrap:wrap;padding:0 var(--pad) .75rem;}
.peca{background:none;border:1px solid var(--line-light);color:rgba(240,232,220,.86);cursor:pointer;
  font-family:var(--sans);font-weight:500;font-size:.68rem;letter-spacing:.1em;
  padding:.45rem .8rem;transition:.25s;white-space:nowrap;}
.peca:hover{color:#fff;border-color:var(--accent);}
.peca[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ===== QUADRO =====
   cada material segue sendo o seu proprio documento: e o que evita as classes
   de um (.nivel, .carta, .trilho) atropelarem as do outro quando tudo fica na
   mesma tela. o quadro rola por dentro; a barra nunca sai. */
.quadro{flex:1 1 auto;position:relative;background:var(--night);}
.quadro iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
.carregando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--night);color:rgba(240,232,220,.5);font-size:.6rem;letter-spacing:.3em;
  text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .25s;}
.carregando.on{opacity:1;}

@media(max-width:820px){
  html{font-size:16px;}
  .barra__linha{gap:.9rem;padding:.6rem var(--pad);}
  .barra__logo{height:20px;}
  .barra__fim{display:none;}
  .frente{font-size:1.08rem;padding:.4rem .7rem;}
  .peca{font-size:.62rem;padding:.4rem .6rem;}
  .pecas{gap:.3rem;padding-bottom:.6rem;}
}
@media(prefers-reduced-motion:reduce){.frente,.peca,.carregando{transition:none;}}
</style>
</head>
<body>

<header class="barra">
  <div class="barra__linha">
    <img class="barra__logo" src="assets/indaia-wordmark-white-trim.png" alt="Eventos Indaiá">
    <div class="frentes" id="frentes" role="tablist" aria-label="Frentes da gastronomia"></div>
    <p class="barra__fim">Gastronomia Indaiá</p>
  </div>
  <div class="pecas" id="pecas" role="tablist" aria-label="Materiais"></div>
</header>

<div class="quadro">
  <p class="carregando" id="carregando">Abrindo</p>
  <iframe id="quadro" title="Material de gastronomia" src="about:blank"></iframe>
</div>

<script>
/* Tudo mora aqui dentro: as duas frentes sao os unicos caminhos, e o material
   escolhido abre no quadro sem sair desta pagina. O id vai pro hash, entao o
   consultor pode salvar/mandar o link ja aberto no material certo. */
const FRENTES = [
  { id:'buffet', nome:'Buffet', pecas:[
      { id:'menus',     nome:'Os cinco menus',  src:'buffet.html' },
      { id:'coquetel',  nome:'Coquetel',        src:'coquetel.html' },
      { id:'brunch',    nome:'Brunch',          src:'brunch.html' },
    ]},
  { id:'bebidas', nome:'Bebidas', pecas:[
      { id:'open-bar',    nome:'Open Bar',        src:'open-bar.html' },
      { id:'drinks',      nome:'Open de Drinks',  src:'open-bar-drinks.html' },
      { id:'caipirinha',  nome:'Open Caipirinha', src:'open-bar-caipirinha.html' },
      { id:'welcome',     nome:'Welcome Drinks',  src:'welcome-drinks.html' },
      { id:'agua',        nome:'Água Saborizada', src:'agua-saborizada.html' },
      { id:'coffee',      nome:'Open Coffee',     src:'open-coffee.html' },
    ]},
];

const $ = (s) => document.querySelector(s);
const quadro = $('#quadro');
let frente = FRENTES[0], peca = FRENTES[0].pecas[0];

function acha(id){
  for (const f of FRENTES) {
    const p = f.pecas.find((x) => x.id === id);
    if (p) return { f, p };
  }
  return null;
}

function pintaFrentes(){
  $('#frentes').innerHTML = FRENTES.map((f) =>
    `<button type="button" class="frente" role="tab" data-f="${f.id}" aria-selected="${f.id===frente.id}">${f.nome}</button>`).join('');
}

function pintaPecas(){
  $('#pecas').innerHTML = frente.pecas.map((p) =>
    `<button type="button" class="peca" role="tab" data-p="${p.id}" aria-selected="${p.id===peca.id}">${p.nome}</button>`).join('');
}

function abre(p, trocaHash){
  peca = p;
  pintaFrentes(); pintaPecas();
  $('#carregando').classList.add('on');
  quadro.src = p.src;
  document.title = p.nome + ' · Gastronomia Indaiá';
  if (trocaHash) location.hash = p.id;
}

quadro.addEventListener('load', () => {
  $('#carregando').classList.remove('on');
  /* o material tem barra e links proprios, que dentro do quadro levariam a um
     hub dentro do hub: some com a barra e faz link de pagina abrir por cima */
  let d;
  try { d = quadro.contentDocument; } catch (e) { return; }
  if (!d) return;
  const st = d.createElement('style');
  st.textContent = '.nav,.hero__volta,.extras__voltar{display:none!important}';
  d.head.appendChild(st);
  d.querySelectorAll('a[href]').forEach((a) => {
    const h = a.getAttribute('href') || '';
    if (!h.startsWith('#')) a.target = '_top';
  });
});

document.addEventListener('click', (e) => {
  const bf = e.target.closest('.frente');
  if (bf) {
    const f = FRENTES.find((x) => x.id === bf.dataset.f);
    if (f && f.id !== frente.id) { frente = f; abre(f.pecas[0], true); }
    return;
  }
  const bp = e.target.closest('.peca');
  if (bp) {
    const p = frente.pecas.find((x) => x.id === bp.dataset.p);
    if (p && p.id !== peca.id) abre(p, true);
  }
});

addEventListener('hashchange', () => {
  const r = acha(location.hash.slice(1));
  if (r && r.p.id !== peca.id) { frente = r.f; abre(r.p, false); }
});

const inicial = acha(location.hash.slice(1));
if (inicial) { frente = inicial.f; peca = inicial.p; }
abre(peca, false);
</script>
</body>
</html>
